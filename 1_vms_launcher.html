<body class="h-full bg-background text-on-background flex flex-col items-center justify-center font-body-md antialiased p-margin-mobile md:p-margin-desktop">
<!-- Top App Bar - Suppressed visually for standalone launcher, but structure maintained for brand anchor -->
<header class="fixed top-0 w-full flex items-center justify-center h-16 px-margin-mobile md:px-margin-desktop bg-surface z-50 shadow-[0_4px_20px_rgba(0,0,0,0.02)] hidden">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">directions_car</span>
<span class="font-headline-md text-headline-md">Vehicle Fleet Portal</span>
</div>
</header>
<!-- Main Launcher Canvas -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] p-8 md:p-12 flex flex-col items-center relative z-10 border border-surface-variant">

<div class="flex flex-col items-center mb-8 text-center">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-4 text-on-primary-container shadow-sm">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: &quot;FILL&quot; 1;">directions_car</span>
</div>
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Welcome to VMS</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">Please select a portal to continue.</p>
</div>
<!-- Selection Modules -->
<div class="w-full flex flex-col gap-4">
<!-- User App Tile -->
<button class="w-full group relative overflow-hidden bg-surface-container-lowest border border-outline-variant hover:border-primary-container rounded-lg p-6 flex items-center justify-between transition-all duration-200 ease-in-out hover:shadow-[0_4px_12px_rgba(0,0,0,0.08)] active:scale-[0.98]" onclick="window.location.href='{{DATA:SCREEN:SCREEN_16}}'">
<div class="flex items-center gap-4 relative z-10">
<div class="w-10 h-10 bg-surface-container rounded-full flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors duration-200">
<span class="material-symbols-outlined">smartphone</span>
</div>
<div class="text-left">
<span class="block font-label-md text-label-md text-on-surface">User App</span>
<span class="block font-label-sm text-label-sm text-on-surface-variant mt-0.5">Vechicle Requests</span>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary-container transition-colors relative z-10">chevron_right</span>
<div class="absolute inset-0 bg-primary-container/5 opacity-0 group-hover:opacity-100 transition-opacity duration-200"></div>
</button>
<!-- Admin Desktop Tile -->
<button class="w-full group relative overflow-hidden bg-surface-container-lowest border border-outline-variant hover:border-primary-container rounded-lg p-6 flex items-center justify-between transition-all duration-200 ease-in-out hover:shadow-[0_4px_12px_rgba(0,0,0,0.08)] active:scale-[0.98]" onclick="window.location.href='{{DATA:SCREEN:SCREEN_14}}'">
<div class="flex items-center gap-4 relative z-10">
<div class="w-10 h-10 bg-surface-container rounded-full flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-on-primary transition-colors duration-200">
<span class="material-symbols-outlined">desktop_windows</span>
</div>
<div class="text-left">
<span class="block font-label-md text-label-md text-on-surface">Admin Desktop</span>
<span class="block font-label-sm text-label-sm text-on-surface-variant mt-0.5">Vehicle management</span>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary-container transition-colors relative z-10">chevron_right</span>
<div class="absolute inset-0 bg-primary-container/5 opacity-0 group-hover:opacity-100 transition-opacity duration-200"></div>
</button>
</div>
<!-- Background Graphic Element -->
<div class="absolute -z-10 top-0 left-0 w-full h-full overflow-hidden rounded-xl opacity-20 pointer-events-none">
<div class="absolute -top-[50%] -right-[20%] w-[150%] h-[150%] bg-[radial-gradient(circle_at_center,var(--tw-colors-primary-container)_0%,transparent_70%)] opacity-10 blur-3xl"></div>
</div>
